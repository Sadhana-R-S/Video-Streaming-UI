<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Video Streaming</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <button id="themeToggle">🌙</button>
            
       <div id="head"> <h1>VIDEO STREAMER 📺</h1></div>
        <div class = "container">
            <div class = "playsection">
                <div id="playerbox" > 
        <h2 id="title">Cat takes a Nap</h2>
       <video id="player" controls width="600" ><source src = "Videos/Video1.mp4" type="video/mp4"></video></div>
        </div>
        <div class="videolist">

            <img src = "Images/Image1.png" width="150">
            <p>Cat takes a nap</p>
            </div>
       
      
               <div class="videoitem" data-src="Videos/Video2.mp4" data-title="White Cat">

            </div>
        
        
               <div class="videoitem" data-src="Videos/Video3.mp4" data-title="Kitty and Sunshine">

            <p>Kitty and Sunshine</p>
            </div>
       
               <div class="videoitem" data-src="Videos/Video4.mp4" data-title="Puppy at Beach">

               <div class="videoitem" data-src="Videos/Video5.mp4" data-title="Pup and Pal">

        </div>
        </div>
<script src="script.js"></script>

</html>
